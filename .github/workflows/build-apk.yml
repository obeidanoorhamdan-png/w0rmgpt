name: Build Lovable Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install --force

      - name: Build Web Project (Bypass Type Checks)
        run: |
          npx vite build || npm run build -- --no-typecheck || true

      - name: Locate Output Directory & Configure Capacitor
        run: |
          BUILD_DIR="dist"
          if [ -d "build" ]; then BUILD_DIR="build"; fi
          if [ -d ".output/public" ]; then BUILD_DIR=".output/public"; fi
          echo "Using web dir: $BUILD_DIR"
          
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "W0rmGPT" "com.w0rmgpt.app" --web-dir "$BUILD_DIR" || true
          npx cap add android || true
          npx cap sync android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: W0rmGPT-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
