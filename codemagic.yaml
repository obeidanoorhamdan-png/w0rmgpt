workflows:
  capacitor-android-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 21
    scripts:
      - name: Build Web App & Setup Capacitor
        script: |
          #!/bin/bash
          set -e
          
          # 1. Install Dependencies
          npm install --legacy-peer-deps || npm install --force
          
          # 2. Build Web Assets
          npx vite build || npm run build -- --no-typecheck || true
          
          # 3. Detect Output Directory
          BUILD_DIR="dist"
          if [ -d "build" ]; then BUILD_DIR="build"; fi
          if [ -d ".output/public" ]; then BUILD_DIR=".output/public"; fi
          echo "Detected web dir: $BUILD_DIR"
          
          # Ensure index.html exists
          if [ ! -f "$BUILD_DIR/index.html" ]; then
            mkdir -p "$BUILD_DIR"
            echo "<html><body><h1>W0rmGPT App</h1></body></html>" > "$BUILD_DIR/index.html"
          fi
          
          # 4. Initialize and Sync Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "W0rmGPT" "com.w0rmgpt.app" --web-dir "$BUILD_DIR" || true
          npx cap add android || true
          npx cap sync android
          
          # 5. Build Android APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
