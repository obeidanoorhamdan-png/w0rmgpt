workflows:
  capacitor-android-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies & build web app
        script: |
          npm install --legacy-peer-deps || npm install --force
          npm run build || npx vite build || true
      - name: Setup Capacitor and Build APK
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "W0rmGPT" "com.w0rmgpt.app" --web-dir dist || true
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
